services:
  telegram_worker:
    build: .
    command: python -m botcore.bot
    env_file: .env
    volumes:
      - bot_data:/var/data
    restart: unless-stopped
  control_panel:
    build: .
    command: uvicorn botcore.admin:api --host 0.0.0.0 --port 8000
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - bot_data:/var/data
    restart: unless-stopped
volumes:
  bot_data:
