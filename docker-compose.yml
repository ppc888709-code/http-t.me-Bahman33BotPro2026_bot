services:
  bot:
    build: .
    command: python -m app.bot
    env_file: .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped
  admin:
    build: .
    command: uvicorn app.admin:app --host 0.0.0.0 --port 8000
    env_file: .env
    volumes:
      - ./data:/app/data
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
