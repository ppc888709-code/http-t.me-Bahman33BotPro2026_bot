services:
  - type: worker
    name: business-bot-pro-worker
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m botcore.bot
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: DATABASE_PATH
        value: /var/data/business_bot.sqlite3
    disk:
      name: business-bot-data
      mountPath: /var/data
      sizeGB: 1
